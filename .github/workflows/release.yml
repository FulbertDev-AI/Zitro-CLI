name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: zitro-cli-linux
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: zitro-cli-macos-intel
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: zitro-cli-macos-arm
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: zitro-cli-windows

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare binary
        shell: bash
        run: |
          mkdir -p release
          if [ "${{ runner.os }}" == "Windows" ]; then
            cp target/${{ matrix.target }}/release/zitro.exe release/
          else
            cp target/${{ matrix.target }}/release/zitro release/
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release/

  create-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release archive
        run: |
          cd artifacts
          zip zitro-cli-linux.zip zitro-cli-linux/*
          zip zitro-cli-macos-intel.zip zitro-cli-macos-intel/*
          zip zitro-cli-macos-arm.zip zitro-cli-macos-arm/*
          zip zitro-cli-windows.zip zitro-cli-windows/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/zitro-cli-linux.zip
            artifacts/zitro-cli-macos-intel.zip
            artifacts/zitro-cli-macos-arm.zip
            artifacts/zitro-cli-windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}